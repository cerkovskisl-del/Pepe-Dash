<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepe Dash - Ultra Extended Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="stats-bar" id="statsBar" style="display: none;">
            <span id="levelNameText">LĪMENIS</span>
            <span id="scoreText">PROGRESS: 0%</span>
            <span id="highScoreText">BEST: 0%</span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="900" height="450"></canvas>
        </div>
        <p class="hint">Space / Klikšķis = Lēkt/Lidot | **P** = Pauze</p>
    </div>
    <script src="game.js"></script>
</body>
</html>
